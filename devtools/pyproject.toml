# Development tools for the Specivo plugin for Hermes Agent. This is not the plugin: Hermes reads only
# the repository root's pyproject.toml, which holds tool settings and no [project] table, so Hermes
# installs nothing for the plugin. This separate project pins the tools and the supported Pythons so
# that uv.lock is the same whichever interpreter creates it.

[project]
name = "hermes-agent-specivo-devtools"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "pytest-xdist>=3.6,<4",
    "pyyaml>=6.0,<7",
    "ruff>=0.8,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.uv]
package = false
