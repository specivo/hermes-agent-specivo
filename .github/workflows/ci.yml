name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # The tools and the supported Pythons are pinned in devtools/ (the plugin root has no
      # [project] table, so Hermes installs nothing for the plugin).
      - run: uv sync --locked --project devtools --python ${{ matrix.python }}
      - run: uv run --project devtools pytest -n 4
      - run: uv run --project devtools ruff check .
      - run: uv run --project devtools ruff format --check .
      - run: uv run --project devtools mypy

  # The plugin loads in Hermes Agent v0.23.3 and passes the checks the plugin catalog runs at
  # admission: manifest, declared hooks against registered hooks, requires_env, the security scan
  # and the "no core override" rule. Hermes is installed the documented way, with its own
  # install.sh pinned to the release commit; it cannot be built as a wheel (its setup.py refuses
  # outside its Nix build), so `pip` or `uv tool install` from git does not work.
  hermes-validate:
    runs-on: ubuntu-latest
    env:
      HERMES_COMMIT: caafe5389ae585ef77387a962aee05b1bcf17029 # v0.23.3
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
          persist-credentials: false
      - name: Install Hermes v0.23.3 with its installer
        run: |
          curl -fsSL "https://raw.githubusercontent.com/NousResearch/hermes-agent/${HERMES_COMMIT}/scripts/install.sh" \
            -o "$RUNNER_TEMP/install.sh"
          bash "$RUNNER_TEMP/install.sh" --commit "$HERMES_COMMIT" \
            --dir "$RUNNER_TEMP/hermes-src" --hermes-home "$RUNNER_TEMP/hermes-home" \
            --non-interactive --skip-browser --skip-computer-use < /dev/null
      - name: hermes plugins validate
        env:
          HERMES_HOME: ${{ runner.temp }}/check-home
        run: '"$HOME/.local/bin/hermes" plugins validate "$GITHUB_WORKSPACE/plugin" --install-deps < /dev/null'
      - name: hermes plugins doctor
        env:
          HERMES_HOME: ${{ runner.temp }}/check-home
        run: '"$HOME/.local/bin/hermes" plugins doctor "$GITHUB_WORKSPACE/plugin" --ci < /dev/null'
